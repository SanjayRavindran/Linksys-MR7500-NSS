name: Build Monthly Snapshot Firmware (Private)

on:
  schedule:
    # Run monthly on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      build_profiles:
        description: 'Firmware configuration profiles to build (both, router, switch-ap)'
        required: false
        type: choice
        options:
          - both
          - router
          - switch-ap
        default: both
      encrypt_artifacts:
        description: 'Encrypt Actions artifact with AES-256 GPG (requires BUILD_ENCRYPTION_KEY secret)'
        required: false
        type: boolean
        default: false
      create_draft_release:
        description: 'Publish private owner-only Draft Release'
        required: false
        type: boolean
        default: true
      retention_days:
        description: 'Encrypted Actions Artifact retention period in days (max 90)'
        required: false
        type: number
        default: 90
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write
  actions: read

jobs:
  pre-build-tests:
    name: Pre-Build Tests & Upstream Patch Apply Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run CI Pre-Build Test Suite (14 Gates)
        run: |
          chmod +x ./scripts/*.sh ./config/profiles/switch-ap/files/etc/uci-defaults/* ./files/etc/init.d/* ./files/etc/uci-defaults/*
          ./scripts/ci_test.sh

      - name: Verify Patches Apply Cleanly Against Upstream Base (qosmio/openwrt-ipq)
        run: |
          BASE_COMMIT="92a2d104145c8d265851c4b388a41bd8e9c21cd9"
          git clone --branch main-nss --depth 10 https://github.com/qosmio/openwrt-ipq.git /tmp/openwrt-base
          cd /tmp/openwrt-base
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "Cloned qosmio/openwrt-ipq main-nss at $ACTUAL_HEAD (expected $BASE_COMMIT)"
          git checkout "$BASE_COMMIT"
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo "Checking & applying $(basename "$patch")..."
            git apply --check "$patch"
            git apply "$patch"
          done
          DTS="target/linux/qualcommax/dts/ipq6018-mr7500.dts"
          if grep -q "aqr_fw" "$DTS"; then
            echo "::error::aqr_fw found in patched DTS!"
            exit 1
          fi
          if grep -q "nss_macsec0" "$DTS"; then
            echo "::error::dead nss_macsec0 found in patched DTS!"
            exit 1
          fi
          grep -q "bt_reset_hog" "$DTS"
          rm -rf /tmp/openwrt-base

  build-firmware:
    name: Build & Publish Private Dual-Profile Firmware
    needs: pre-build-tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          echo "=== Free disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a --force 2>/dev/null || true
          echo "=== Free disk space after cleanup ==="
          df -h /

      - name: Install OpenWrt Build Dependencies (Ubuntu 24.04)
        timeout-minutes: 10
        run: |
          set -e
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          probe_mirrors() {
            for candidate in \
              "https://mirrors.edge.kernel.org/ubuntu" \
              "http://archive.ubuntu.com/ubuntu" \
              "https://mirrors.mit.edu/ubuntu" \
              "https://mirror.math.princeton.edu/pub/ubuntu" \
              "http://azure.archive.ubuntu.com/ubuntu"; do
              if curl -4fsIL --max-time 6 "${candidate}/dists/noble/Release" >/dev/null 2>&1; then
                echo "$candidate"
                return 0
              fi
            done
            return 1
          }
          MIRROR="$(probe_mirrors || true)"
          if [ -z "$MIRROR" ]; then
            echo "[!] Default DNS/mirror probe failed; applying 1.1.1.1/8.8.8.8 fallback in resolv.conf..."
            printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" | sudo tee /etc/resolv.conf >/dev/null
            MIRROR="$(probe_mirrors || true)"
          fi
          if [ -z "$MIRROR" ]; then
            echo "::error::Unable to reach any Ubuntu 24.04 APT mirror!"
            exit 1
          fi
          echo "Selected Ubuntu APT mirror: $MIRROR"
          printf "%s\n" "$MIRROR" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i -E "s#mirror\+file:/etc/apt/apt-mirrors\.txt#${MIRROR}#g; s#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu/?#${MIRROR}#g" /etc/apt/sources.list.d/ubuntu.sources
          fi
          APT_OPTS="-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2 -o DPkg::Options::=--force-confdef -o DPkg::Options::=--force-confold"
          sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_OPTS update
          sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_OPTS install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl bc time \
            device-tree-compiler squashfs-tools u-boot-tools gpg zstd xz-utils

      - name: Cache OpenWrt dl Directory
        uses: actions/cache@v4
        with:
          path: /home/runner/openwrt-mr7500-build/dl
          key: openwrt-dl-${{ hashFiles('config/mr7500_nss_diffconfig') }}
          restore-keys: |
            openwrt-dl-

      - name: Extract AQR114C Blob Just-In-Time (Non-Redistributed)
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/extract_stock_blobs.sh /home/runner/mr7500_stock_dl

      - name: Build OpenWrt + NSS Firmware Variants
        run: |
          PROFILE_ARG="${{ github.event.inputs.build_profiles || 'both' }}"
          [ "$PROFILE_ARG" = "both" ] && PROFILE_ARG="all"
          BUILD_DIR="/home/runner/openwrt-mr7500-build" ./scripts/build.sh --profile "$PROFILE_ARG"

      - name: Validate & Package Dual-Profile Private Release Bundle
        id: package
        run: |
          BUILD_DATE=$(date +'%Y%m%d')
          PROFILE_ARG="${{ github.event.inputs.build_profiles || 'both' }}"
          PROFILES_OUT="/home/runner/openwrt-mr7500-build/bin/targets/qualcommax/ipq60xx-profiles"
          PKG_DIR="/home/runner/mr7500-release"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR"

          if [ "$PROFILE_ARG" = "both" ] || [ "$PROFILE_ARG" = "router" ]; then
            ./scripts/validate_build_artifacts.sh "$PROFILES_OUT/router-mode" router
            mkdir -p "$PKG_DIR/router-mode"
            cp -a "$PROFILES_OUT/router-mode/"* "$PKG_DIR/router-mode/"
          fi

          if [ "$PROFILE_ARG" = "both" ] || [ "$PROFILE_ARG" = "switch-ap" ]; then
            ./scripts/validate_build_artifacts.sh "$PROFILES_OUT/switch-ap-mode" switch-ap
            mkdir -p "$PKG_DIR/switch-ap-mode"
            cp -a "$PROFILES_OUT/switch-ap-mode/"* "$PKG_DIR/switch-ap-mode/"
          fi

          cp "$GITHUB_WORKSPACE/scripts/flash_mr7500_tftp_ubuntu.sh" "$PKG_DIR/"
          chmod +x "$PKG_DIR/flash_mr7500_tftp_ubuntu.sh"
          cp "$GITHUB_WORKSPACE/SOURCES_AND_LICENSES.md" "$PKG_DIR/"
          cp "$GITHUB_WORKSPACE/LICENSE" "$PKG_DIR/"
          cp "$GITHUB_WORKSPACE/MONTHLY_UPDATE_GUIDE.md" "$PKG_DIR/"

          cd "$PKG_DIR"
          find . -maxdepth 2 -type f -name '*mr7500*' | sed 's|^\./||' | sort | xargs -r sha256sum > sha256sums.txt
          sha256sum flash_mr7500_tftp_ubuntu.sh >> sha256sums.txt
          find . -maxdepth 2 -type f -name '*mr7500*' | sed 's|^\./||' | sort | xargs -r md5sum > md5sums.txt

          cat << EOF_MANIFEST > BUILD_MANIFEST.txt
          Linksys MR7500 (Hydra Pro 6E) Qualcomm NSS Firmware Release
          ==========================================================
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%SZ")
          Base Tree: qosmio/openwrt-ipq (main-nss @ 92a2d104145c8d265851c4b388a41bd8e9c21cd9)
          Commit Revision: ${{ github.sha }}
          Kernel: 6.12.92 | NSS Firmware: 12.5-210 | Crypto: EIP-197
          AQR114C Protection: Enabled (FS-only v5.6.5 Cybertan Divo; aqr_fw NVMEM cell omitted)
          GMAC IPGT Tune: 0x70 on CPPE GMAC0..3 (qca-ssdk patch 002)
          NSS pbuf / RPS Fix: Active with ath11k nss_offload=0 (extra_pbuf=3100000, rps=15)
          IRQ Pinning: /etc/init.d/mr7500-irq-tune (START=96, NSS/ath11k/QCN9074 off CPU 0)
          Bluetooth CSR8811: Disabled via DTS (blsp1_uart2 disabled, tlmm GPIO 34 held low)

          Included Firmware Profiles:
            1) router-mode/    - Default Router Mode (10.143.1.1/24, WAN DHCP, LAN DHCPv4 + SLAAC, NAT)
            2) switch-ap-mode/ - Current Switch + AP Config (192.168.1.91/24, all 5 ports bridged, DHCP disabled)

          Ubuntu 24.04 / 26.04 LTS Flash Utility (bundled):
            sudo ./flash_mr7500_tftp_ubuntu.sh --variant switch-ap   # or --variant router
          EOF_MANIFEST

          ARCHIVE_NAME="mr7500-openwrt-nss-${BUILD_DATE}.tar.gz"
          tar -czvf "/home/runner/$ARCHIVE_NAME" *

          ENCRYPT_KEY="${{ secrets.BUILD_ENCRYPTION_KEY }}"
          if [ -n "$ENCRYPT_KEY" ] || [ "${{ github.event.inputs.encrypt_artifacts }}" = "true" ]; then
            if [ -z "$ENCRYPT_KEY" ]; then
              echo "::error::BUILD_ENCRYPTION_KEY secret is required when encrypt_artifacts=true."
              exit 1
            fi
            gpg --batch --yes --passphrase "$ENCRYPT_KEY" --symmetric --cipher-algo AES256 \
              -o "/home/runner/${ARCHIVE_NAME}.gpg" "/home/runner/$ARCHIVE_NAME"
            echo "ENC_ARTIFACT=/home/runner/${ARCHIVE_NAME}.gpg" >> $GITHUB_OUTPUT
            echo "IS_ENCRYPTED=true" >> $GITHUB_OUTPUT
          else
            echo "IS_ENCRYPTED=false" >> $GITHUB_OUTPUT
          fi

          echo "ARCHIVE_PATH=/home/runner/$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Upload Encrypted Actions Artifact (Only When GPG Key Configured)
        if: steps.package.outputs.IS_ENCRYPTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mr7500-firmware-encrypted-${{ steps.package.outputs.BUILD_DATE }}
          path: ${{ steps.package.outputs.ENC_ARTIFACT }}
          retention-days: ${{ github.event.inputs.retention_days || 90 }}
          if-no-files-found: error

      - name: Publish Private Owner-Only Draft Release
        if: github.event.inputs.create_draft_release != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DATE="${{ steps.package.outputs.BUILD_DATE }}"
          TAG_NAME="snapshot-${BUILD_DATE}"
          TITLE="Linksys MR7500 NSS Snapshot ${BUILD_DATE} (Router + Switch/AP + Ubuntu TFTP Flasher)"
          RELEASE_DIR="/home/runner/mr7500-release"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "[*] Replacing existing draft release $TAG_NAME..."
            gh release delete "$TAG_NAME" --yes --cleanup-tag || true
          fi

          gh release create "$TAG_NAME" \
            "${{ steps.package.outputs.ARCHIVE_PATH }}" \
            "$RELEASE_DIR/flash_mr7500_tftp_ubuntu.sh" \
            "$RELEASE_DIR/sha256sums.txt" \
            "$RELEASE_DIR/BUILD_MANIFEST.txt" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes-file "$RELEASE_DIR/BUILD_MANIFEST.txt" \
            --draft
